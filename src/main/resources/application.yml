server:
  port: 8080

spring:
  application:
    name: deepread-backend

  datasource:
    url: jdbc:mysql://localhost:3306/deepread?serverTimezone=Asia/Seoul
    username: root
    password: 1103

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: c66636a31470903c5b81583fd668cc83
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/api/auth/kakao/callback"

            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao

          naver:
            client-id: Yyk_DtmmodG0yDk4EYJ3
            client-secret: EBn3dhzgz1
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/api/auth/naver/callback"
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: 567034279915-k6evihs4g4b3ggksiohl2nknrg7ea7cm.apps.googleusercontent.com
            client-secret: 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
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/api/auth/google/callback"
            scope:
              - profile
              - email
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: 29bca18d500a5f5d21c23490e7d45dcbe9fa531ec120ae129972144c1f5ffc8f
  access-token-expiration: 360000     # 6분
  refresh-token-expiration: 1209600000  # 14일
